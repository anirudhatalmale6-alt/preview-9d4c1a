<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private preview</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#000;color:#fdfdfd;display:grid;place-items:center;padding:24px;
       font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .box{width:100%;max-width:380px;text-align:center}
  .bar{height:3px;width:100%;margin:0 0 28px;
       background:linear-gradient(90deg,#1075c4 0 20%,#f7000f 20% 40%,#fdfdfd 40% 60%,#edea00 60% 80%,#58b531 80% 100%)}
  h1{font-size:19px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px}
  p{color:#9a9a9a;font-size:14px;margin:0 0 26px}
  label{display:block;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9a9a9a;margin:0 0 8px}
  input{width:100%;padding:14px 15px;background:#141414;border:1px solid #2c2c2c;border-radius:8px;
        color:#fdfdfd;font-size:16px;font-family:inherit}
  input:focus{outline:none;border-color:#fdfdfd}
  button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:8px;background:#fdfdfd;color:#000;
         font:700 13px/1 inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  button[disabled]{opacity:.55;cursor:default}
  .msg{min-height:20px;margin-top:16px;font-size:13px;color:#f7000f}
</style>
</head>

  <h1>Private preview</h1>

    <button type="submit" id="go">Unlock</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
</main>

<script>
(function () {
  var PAYLOAD = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('gate'),
      pw   = document.getElementById('pw'),
      go   = document.getElementById('go'),
      msg  = document.getElementById('msg');

  var KEY = 'osr_preview_key';

  function b2ab(b64) {
    var bin = atob(b64), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function derive(passphrase) {
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b2ab(PAYLOAD.salt), iterations: PAYLOAD.it, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }

  function decrypt(key) {
    return crypto.subtle
      .decrypt({ name: 'AES-GCM', iv: b2ab(PAYLOAD.iv) }, key, b2ab(PAYLOAD.ct))
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  /* Swap the gate for the real page, then run its scripts in order. */
  function render(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');

    document.title = doc.title;

    // carry over the real page's head (stylesheet, preloads, favicon, meta)
    var keep = document.querySelector('meta[charset]');
    document.head.innerHTML = '';
    if (keep) document.head.appendChild(keep);
    Array.prototype.forEach.call(doc.head.children, function (n) {
      if (n.tagName === 'SCRIPT') return;               // re-created below
      if (n.tagName === 'META' && n.getAttribute('charset') !== null) return;
      document.head.appendChild(document.importNode(n, true));
    });

    document.body.parentNode.replaceChild(document.importNode(doc.body, true), document.body);

    // a parsed <script> never executes on adoption — rebuild each one
    var scripts = Array.prototype.slice.call(doc.querySelectorAll('script'));
    (function next(i) {
      if (i >= scripts.length) {
        document.documentElement.setAttribute('data-unlocked', '1');
        return;
      }
      var old = scripts[i], s = document.createElement('script');
      Array.prototype.forEach.call(old.attributes, function (a) { s.setAttribute(a.name, a.value); });
      if (old.src) { s.onload = s.onerror = function () { next(i + 1); }; document.body.appendChild(s); }
      else { s.textContent = old.textContent; document.body.appendChild(s); next(i + 1); }
    })(0);
  }

  function unlock(passphrase, remember) {
    go.disabled = true;
    msg.style.color = '#9a9a9a';
    msg.textContent = 'Unlocking…';
    return derive(passphrase)
      .then(function (key) {
        return decrypt(key).then(function (html) {
          if (remember) {
            return crypto.subtle.exportKey('raw', key).then(function (raw) {
              try {
                sessionStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, new Uint8Array(raw))));
              } catch (e) {}
              render(html);
            });
          }
          render(html);
        });
      })
      .catch(function () {
        go.disabled = false;
        msg.style.color = '#f7000f';
        msg.textContent = 'That passphrase is not right.';
        pw.select();
      });
  }

  /* Already unlocked in this tab (e.g. arriving back from the thank-you page). */
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    crypto.subtle
      .importKey('raw', b2ab(saved), 'AES-GCM', false, ['decrypt'])
      .then(decrypt)
      .then(render)
      .catch(function () { try { sessionStorage.removeItem(KEY); } catch (e) {} });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (pw.value) unlock(pw.value, true);
  });
})();
</script>
